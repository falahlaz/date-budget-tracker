name: CI/CD Pipeline                 # 1. Nama workflow

on:                                  # 2. Trigger / Event
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DATABASE_URL: mysql://datebud:datebud@localhost:3306/datebud
  JWT_SECRET: required

jobs:                                # 4. Daftar Jobs
  build-and-test:                    # Job ID
    name: Build and Run Tests
    runs-on: ubuntu-latest           # OS / Runner yang dipakai

    steps:                           # 5. Langkah-langkah di dalam job
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

